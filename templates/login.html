{% extends 'base.html' %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static',filename='admin.css') }}">
<section class="panel admin-login">
  <h1>Đăng nhập</h1>
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <label>Tài khoản<input name="username" required autocomplete="username"></label>
    <label>Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label>
    <button type="submit">Đăng nhập</button>
  </form>
  <p>Chưa có tài khoản? <a href="{{ url_for('auth.register') }}">Đăng ký và tạo hồ sơ</a>.</p>
</section>
{% endblock %}
