<div class="fl-mobile-header"><button id="menu-open" type="button" aria-label="Mở điều hướng" aria-controls="mobile-drawer" aria-expanded="false">☰</button><a href="{{ url_for('home') }}"><img src="{{ url_for('static',filename='foodlens-mark.svg') }}" alt="">FoodLens</a><span aria-label="Khu vực">⌖</span></div>
<div id="drawer-backdrop" class="fl-drawer-backdrop" hidden></div>
<nav id="mobile-drawer" class="fl-drawer" aria-label="Điều hướng di động" hidden>
  <div class="fl-drawer-head"><strong><img src="{{ url_for('static',filename='foodlens-mark.svg') }}" alt="">FoodLens</strong><button id="menu-close" type="button" aria-label="Đóng điều hướng">✕</button></div>
  <a {% if request.endpoint == 'home' %}aria-current="page"{% endif %} href="{{ url_for('home') }}">⌂ &nbsp;Trang chủ</a>
  <a {% if request.endpoint in ['results','search'] %}aria-current="page"{% endif %} href="{{ url_for('home') }}#search">⌕ &nbsp;Tìm kiếm</a>
  <a {% if request.endpoint in ['assistant_page','assistant_send'] %}aria-current="page"{% endif %} href="{{ url_for('assistant_page') }}">▣ &nbsp;Trợ lý nhà hàng</a>
  {% if assistant_shell|default(false) %}<button type="button" id="mobile-favorites-nav">♥ &nbsp;Yêu thích</button>{% endif %}
  <a {% if request.endpoint == 'research_dashboard' %}aria-current="page"{% endif %} href="{{ url_for('research_dashboard') }}">▥ &nbsp;Xu hướng</a>
  {% if current_user.role == 'admin' %}
  <a {% if request.endpoint and request.endpoint.startswith('admin.') %}aria-current="page"{% endif %} href="{{ url_for('admin.index') }}">✓ &nbsp;Gán nhãn</a>
  <a {% if request.endpoint and request.endpoint.startswith('locations.') %}aria-current="page"{% endif %} href="{{ url_for('locations.index') }}">⌖ &nbsp;Khu vực</a>
  {% endif %}
  <a {% if request.endpoint == 'auth.profile' %}aria-current="page"{% endif %} href="{{ url_for('auth.profile') }}">◯ &nbsp;Hồ sơ</a>
  <form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button type="submit">↪ &nbsp;Đăng xuất</button></form>
</nav>
